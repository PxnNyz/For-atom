<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkinScan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="static/css/style.css">
</head>
<body class="p-4">
    <div class="container">
        <div id="upload-area" class="upload-area mb-3">
            <input id="file-input" type="file" accept="image/*" hidden>
            <img src="static/svg/upload.svg" class="upload-icon" alt="Upload" width="50">
            <p>Drag & drop or click to upload an image</p>
        </div>
        <div id="image-preview-container" class="preview-container" style="display:none;">
            <img id="image-preview" class="img-fluid" alt="Preview">
        </div>
        <button id="analyze-btn" class="btn btn-primary" disabled>Analyze</button>
        <hr>
        <h5>Dataset comparison</h5>
        <div id="dataset-comparison-container" class="row g-2"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="static/js/main.js"></script>
</body>
</html>
